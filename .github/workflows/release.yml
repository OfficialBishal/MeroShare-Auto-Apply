name: release

# Trigger on tag pushes matching `v*`. E.g. `v2026.05.04`. Tags get
# stripped of the leading `v` by both build scripts when stamping the
# version into _version.py, so the on-disk version matches what the
# updater reads from the GitHub API.
on:
  push:
    tags:
      - 'v*'

permissions:
  # Needed by softprops/action-gh-release to attach .dmg / .zip
  # assets to the release entry on GitHub. Default GITHUB_TOKEN
  # permissions for tag pushes vary by repo settings; declaring
  # this explicitly means the workflow works regardless.
  contents: write

jobs:
  # macOS build. Produces the .dmg with bundled Python and rumps.
  # Runs on macos-latest because the build script depends on
  # `iconutil`, `sips`, `plutil`, `hdiutil`. All built into macOS,
  # none portable to Linux.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so `git describe` resolves the tag

      - name: Cache python-build-standalone tarball
        uses: actions/cache@v4
        with:
          path: ~/.cache/meroshare-build
          # Bump this key when bumping PY_TAG in build_dmg.sh. The
          # cache is keyed per-OS-arch since the tarballs differ.
          key: pbs-${{ runner.os }}-${{ runner.arch }}-20241016

      - name: Build .dmg
        run: ./scripts/build_dmg.sh

      - name: Upload .dmg to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          # Auto-generated notes are a fine starting point; the user
          # can edit the release on GitHub to add a "What's changed"
          # blurb before un-drafting it.
          generate_release_notes: true
          draft: false
          prerelease: false

      # Bump the Homebrew cask on `main` so `brew upgrade` picks up
      # the new version. Skipped silently when the cask file is
      # missing or already up-to-date — keeps the workflow idempotent
      # if a release run is replayed. The version comes through an
      # env var so it never hits the shell as raw template
      # interpolation (workflow-injection-safe pattern).
      - name: Bump Homebrew cask
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CASK="Casks/meroshare-auto-apply.rb"
          if [ ! -f "$CASK" ]; then
            echo "No cask file; skipping bump."
            exit 0
          fi
          VERSION="${REF_NAME#v}"
          SHA=$(shasum -a 256 dist/MeroShare-Auto-Apply.dmg | awk '{print $1}')
          git fetch origin main
          git checkout -B main origin/main
          # BSD sed (macos-latest runner). The .bak suffix is required
          # on BSD and harmless on GNU.
          sed -i.bak -E "s/^  version \".*\"/  version \"${VERSION}\"/" "$CASK"
          sed -i.bak -E "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" "$CASK"
          rm "${CASK}.bak"
          if git diff --quiet -- "$CASK"; then
            echo "Cask already at ${VERSION} with matching sha256; nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK"
          git commit -m "Bump Homebrew cask to ${VERSION}"
          git push origin main

  # Windows portable .zip. Cross-built on macOS (no Windows runner
  # needed since we only download Python embeddable + zip the source).
  # Putting it in the same workflow ensures both artifacts land in
  # the same release, so the updater (and curious users) see them
  # together.
  build-windows-zip:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache Python embeddable
        uses: actions/cache@v4
        with:
          path: ~/.cache/meroshare-build
          key: pyembed-3.12.7

      - name: Build Windows .zip
        run: ./scripts/build_windows.sh

      - name: Upload .zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: false
          draft: false
          prerelease: false
